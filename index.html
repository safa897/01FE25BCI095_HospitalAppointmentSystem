<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Appointment</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>HOSPITAL APPOINTMENT SYSTEM</h1><br><br>
    <h3>Patient Login:</h3>
    <label for="pname">Patient's Name:</label>
    <input type="text" id="pname" placeholder="Enter patient's name" required><br><br>
    <label for="p_age">Patient's Age:</label>
    <input type="number" id="p_age" placeholder="Enter patient's age" required><br><br>
    <button type="button" onclick="patientLogin()">Submit</button>

    <h3>Doctors:</h3>
    <p id="listdoctors"></p>

    <h3>Booking Form:</h3>
    <label for="appointdate">Appointment Date:</label>
    <input type="date" id="appointdate" required><br><br>
    <label for="appointtime">Appointment Time:</label>
    <input type="time" id="appointtime" required><br><br>
    <label for="reason">Reason for Visit:</label>
    <input type="text" id="reason" placeholder="Enter reason for visit" required><br><br>

    <script src="script.js"></script>

</body>
</html>
